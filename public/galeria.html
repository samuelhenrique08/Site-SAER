    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="logo" aria-label="SAER - Página inicial">
                <img src="../image/SaerLogo.png" alt="" width="48" height="48">
                <span class="logo-texto">SAER</span>
            </a>

            <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-menu">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" aria-hidden="true">
                    <line x1="3" y1="6" x2="21" y2="6" />
                    <line x1="3" y1="12" x2="21" y2="12" />
                    <line x1="3" y1="18" x2="21" y2="18" />
                </svg>
            </button>

            <nav class="nav" aria-label="Menu principal">
                <ul class="nav-menu" id="nav-menu">

                    <li><a href="memorial.html">Memorial</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <!-- ==================== TÍTULO ==================== -->
        <section class="page-header" aria-labelledby="page-titulo">
            <span class="hero-tag">Registros SAER</span>
            <h1 id="page-titulo">Galeria</h1>
            <p>Fotos das operações e da equipe do Serviço Aeropolicial</p>
        </section>

        <!-- ==================== VISUALIZADOR ==================== -->
        <section class="galeria-sec" aria-label="Visualizador de fotos">

            <div class="galeria-container">
                <button class="nav-btn" data-direcao="-1" aria-label="Foto anterior" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polyline points="15 18 9 12 15 6" />
                    </svg>
                </button>

                <figure class="foto-display">
                    <button class="foto-wrapper" id="fotoBotao" type="button" aria-label="Ampliar foto">
                        <img id="fotoAtual" src="../image/galeria1.png" alt="Foto SAER 1" decoding="async"
                            class="foto-principal">
                    </button>
                    <figcaption class="foto-legenda" id="fotoLegenda"></figcaption>
                </figure>

                <button class="nav-btn" data-direcao="1" aria-label="Próxima foto" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </button>
            </div>

            <!-- Contador + bolinhas -->
            <div class="galeria-status" aria-live="polite">
                <span class="contador" id="fotoContador">1 / 17</span>
                <div class="paginacao-bolinhas" id="bolinhasContainer" role="tablist"
                    aria-label="Navegação rápida entre fotos"></div>
            </div>

            <!-- Miniaturas -->
            <div class="miniaturas-wrapper">
                <div class="miniaturas" id="miniaturasContainer" role="tablist" aria-label="Miniaturas das fotos"></div>
            </div>

        </section>

    </main>

    <!-- ==================== LIGHTBOX ==================== -->
    <div class="lightbox" id="lightbox" hidden aria-modal="true" role="dialog" aria-label="Foto ampliada">
        <button class="lightbox-fechar" id="lightboxFechar" aria-label="Fechar visualização" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <!-- ==================== FOOTER ==================== -->

        <div class="rodape-conteudo">
            <div class="rodape-info">
                <img src="../image/SaerLogo.png" alt="" width="40" height="40" loading="lazy">
                <p>Serviço Aeropolicial — PCERJ</p>
            </div>
